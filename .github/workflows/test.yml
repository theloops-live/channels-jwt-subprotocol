name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.10"
            pins: >-
              "Django==4.2.*" "channels==4.0.*" "daphne==4.0.*"
              "djangorestframework==3.14.*" "djangorestframework-simplejwt==5.3.*"
              "uvicorn==0.30.*" "websockets==14.*"
          - name: latest
            python: "3.12"
            pins: ""
          - name: latest
            python: "3.13"
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install ".[test]" ${{ matrix.pins }}
      - name: Test
        run: python -m pytest -v
